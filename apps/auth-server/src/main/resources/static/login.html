<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in · SecureOne</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 24rem; margin: 3rem auto; padding: 0 1rem; }
      label { display: block; font-size: 0.875rem; margin-bottom: 0.25rem; }
      input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; }
      button { width: 100%; padding: 0.6rem; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
      .links { margin-top: 1rem; font-size: 0.875rem; }
      .links a { color: #4f46e5; }
      .banner { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.875rem; }
      .banner.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
      .banner.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
      .panel { margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #e5e7eb; background: #f9fafb; font-size: 0.875rem; }
      .panel pre { margin: 0.5rem 0 0; padding: 0.5rem; background: #111827; color: #f9fafb; border-radius: 6px; overflow: auto; font-size: 11px; }
      #tenant-wrap { display: none; }
    </style>
  </head>
  <body>
    <h1 id="title">Sign in</h1>
    <p id="subtitle" hidden></p>
    <div id="banner" class="banner" hidden role="alert"></div>
    <p id="methods"></p>
    <form method="post" action="/login" id="login-form">
      <div id="tenant-wrap">
        <label for="tenant">Tenant slug</label>
        <input id="tenant" name="tenant" placeholder="your-tenant" />
      </div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" />
      <input type="hidden" name="username" id="username" />
      <input type="hidden" name="applicationId" id="applicationId" />
      <input type="hidden" name="continue" id="continue" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />
      <button type="submit">Sign in with password</button>
    </form>
    <div id="session-panel" class="panel" hidden>
      <strong>Session signed in</strong>
      <p id="session-hint" style="margin: 0.35rem 0 0"></p>
      <pre id="session-json">Loading…</pre>
      <p style="margin: 0.5rem 0 0">
        Form login only sets a <code>JSESSIONID</code> cookie — not an OAuth access token. To get a token and
        <code>/userinfo</code>, use your app&apos;s Sign in button (OAuth) or the
        <a href="/account/oauth-dev.html">OAuth dev tool</a>.
      </p>
    </div>
    <div class="links">
      <p><a id="signup-link" href="/account/signup.html">Create an account</a></p>
      <p><a id="forgot-link" href="/account/forgot-password.html">Forgot password</a></p>
      <p><a id="magic-link" href="/account/magic-link.html">Sign in with magic link</a></p>
    </div>
    <script>
      (function () {
        const CONTINUE_KEY = "secureone:oauth_continue";
        const params = new URLSearchParams(location.search);
        let continueUrl = params.get("continue");
        if (continueUrl && continueUrl.includes("/oauth2/authorize")) {
          sessionStorage.setItem(CONTINUE_KEY, continueUrl);
          document.getElementById("continue").value = continueUrl;
        } else {
          const stored = sessionStorage.getItem(CONTINUE_KEY);
          if (stored && stored.includes("/oauth2/authorize")) {
            continueUrl = stored;
            document.getElementById("continue").value = stored;
          }
        }

        const appId = params.get("applicationId");
        const tenantWrap = document.getElementById("tenant-wrap");
        const tenantInput = document.getElementById("tenant");

        function isAppScoped() {
          return Boolean(document.getElementById("applicationId").value.trim());
        }

        function syncUsername() {
          if (isAppScoped()) {
            document.getElementById("username").value = "";
            return;
          }
          const tenant = tenantInput.value.trim();
          const email = document.getElementById("email").value.trim().toLowerCase();
          document.getElementById("username").value =
            tenant && email ? tenant + ":" + email : "";
        }

        const banner = document.getElementById("banner");
        if (banner) {
          if (params.has("signedIn")) {
            if (continueUrl && continueUrl.includes("/oauth2/authorize")) {
              banner.textContent = "Signed in — returning to your application…";
              banner.className = "banner success";
              banner.hidden = false;
              sessionStorage.removeItem(CONTINUE_KEY);
              location.replace(continueUrl);
              return;
            }
            banner.textContent = "Signed in successfully.";
            banner.className = "banner success";
            banner.hidden = false;
            const panel = document.getElementById("session-panel");
            const hint = document.getElementById("session-hint");
            const json = document.getElementById("session-json");
            panel.hidden = false;
            fetch("/api/v1/auth/me", { credentials: "same-origin" })
              .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
              .then(({ ok, body }) => {
                if (!ok) {
                  hint.textContent = "Session cookie present but /api/v1/auth/me returned an error.";
                  json.textContent = JSON.stringify(body, null, 2);
                  return;
                }
                hint.textContent =
                  "GET /api/v1/auth/me (check Network tab) — use OAuth for access_token.";
                json.textContent = JSON.stringify(body, null, 2);
              })
              .catch((e) => {
                hint.textContent = "Could not load session profile.";
                json.textContent = String(e);
              });
          } else if (continueUrl && continueUrl.includes("/oauth2/authorize")) {
            fetch("/api/v1/auth/me", { credentials: "same-origin" })
              .then((r) => (r.ok ? r.json() : null))
              .then((body) => {
                if (body && body.authenticated) {
                  sessionStorage.removeItem(CONTINUE_KEY);
                  location.replace(continueUrl);
                }
              })
              .catch(() => undefined);
          } else if (params.get("error") === "expired") {
            banner.textContent =
              "Your password has expired and you cannot sign in. A password reset link has been sent to your email. Use that link to set a new password, or choose Forgot password below.";
            banner.className = "banner error";
            banner.hidden = false;
          } else if (params.has("error")) {
            banner.textContent = isAppScoped()
              ? "Sign in failed. Check your email and password. If your email is not verified, open the link from your inbox."
              : "Sign in failed. Check tenant slug, email, and password. If your email is not verified, open the link from your inbox or ask an administrator.";
            banner.className = "banner error";
            banner.hidden = false;
          }
        }

        if (appId) {
          applyApplicationScope(appId);
        } else if (continueUrl) {
          try {
            const clientId = new URL(continueUrl, location.origin).searchParams.get("client_id");
            if (clientId) {
              fetch("/api/v1/applications/resolve?clientId=" + encodeURIComponent(clientId))
                .then((r) => (r.ok ? r.json() : null))
                .then((resolved) => {
                  if (resolved && resolved.applicationId) {
                    applyApplicationScope(resolved.applicationId);
                  }
                })
                .catch(() => undefined);
            }
          } catch (_) {
            // ignore malformed continue URL
          }
        }

        function applyApplicationScope(appId) {
          document.getElementById("applicationId").value = appId;
          const suffix = "?applicationId=" + encodeURIComponent(appId);
          document.getElementById("signup-link").href = "/account/signup.html" + suffix;
          document.getElementById("forgot-link").href = "/account/forgot-password.html" + suffix;
          document.getElementById("magic-link").href = "/account/magic-link.html" + suffix;
          tenantWrap.style.display = "none";
          tenantInput.required = false;
          fetch("/api/v1/applications/" + encodeURIComponent(appId) + "/signup")
            .then((r) => (r.ok ? r.json() : null))
            .then((opts) => {
              if (opts && opts.applicationName) {
                document.getElementById("title").textContent = "Sign in to " + opts.applicationName;
                const subtitle = document.getElementById("subtitle");
                subtitle.textContent = "Use the same email and password across apps from this provider.";
                subtitle.hidden = false;
              }
            })
            .catch(() => undefined);
        }

        if (!appId && !continueUrl) {
          tenantWrap.style.display = "block";
          tenantInput.required = true;
        }

        const form = document.getElementById("login-form");
        form.addEventListener("submit", (event) => {
          syncUsername();
          const email = document.getElementById("email").value.trim();
          if (!email) {
            event.preventDefault();
            if (banner) {
              banner.textContent = "Enter your email address.";
              banner.className = "banner error";
              banner.hidden = false;
            }
            return;
          }
          if (!isAppScoped() && !tenantInput.value.trim()) {
            event.preventDefault();
            if (banner) {
              banner.textContent = "Enter your tenant slug or open this page from your application.";
              banner.className = "banner error";
              banner.hidden = false;
            }
          }
        });
        tenantInput.addEventListener("input", syncUsername);
        document.getElementById("email").addEventListener("input", syncUsername);

        fetch("/api/v1/auth/methods")
          .then((r) => r.json())
          .then((methods) => {
            const available = methods.filter((m) => m.available).map((m) => m.name);
            document.getElementById("methods").textContent =
              "Available: " + (available.length ? available.join(", ") : "none");
          })
          .catch(() => {
            document.getElementById("methods").textContent = "";
          });
      })();
    </script>
  </body>
</html>
