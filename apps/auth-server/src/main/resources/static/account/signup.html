<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account · SecureOne</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 28rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        margin-bottom: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .msg {
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 8px;
        font-size: 0.875rem;
      }
      .ok {
        background: #ecfdf5;
        color: #065f46;
      }
      .err {
        background: #fef2f2;
        color: #991b1b;
      }
      .hint {
        font-size: 0.8rem;
        color: #666;
        margin-bottom: 1rem;
      }
      a {
        color: #4f46e5;
      }
    </style>
    <script src="/account/password-policy-ui.js"></script>
  </head>
  <body>
    <h1>Create account</h1>
    <p id="intro">Loading…</p>
    <form id="form" hidden>
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" />
      <label for="first">First name</label>
      <input id="first" autocomplete="given-name" />
      <label for="last">Last name</label>
      <input id="last" autocomplete="family-name" />
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="new-password" />
      <div id="checklist"></div>
      <p id="policy" class="hint"></p>
      <button type="submit">Create account</button>
    </form>
    <div id="status"></div>
    <p><a id="login" href="/login.html">Already have an account? Sign in</a></p>
    <script>
      const params = new URLSearchParams(location.search);
      const applicationId = params.get("applicationId");
      const intro = document.getElementById("intro");
      const form = document.getElementById("form");
      const status = document.getElementById("status");
      const policyHint = document.getElementById("policy");
      const checklist = document.getElementById("checklist");
      const passwordInput = document.getElementById("password");
      let passwordPolicy = null;

      if (!applicationId) {
        intro.textContent = "Missing applicationId in the URL.";
      } else {
        document.getElementById("login").href =
          "/login.html?applicationId=" + encodeURIComponent(applicationId);
        fetch("/api/v1/applications/" + encodeURIComponent(applicationId) + "/signup")
          .then((r) => r.json())
          .then((opts) => {
            if (!opts.signupEnabled) {
              intro.textContent =
                "Sign-up is not open for " + (opts.applicationName || "this application") + ".";
              return;
            }
            intro.textContent = "Register for " + (opts.applicationName || "this application");
            if (opts.passwordPolicy) {
              passwordPolicy = opts.passwordPolicy;
              SecureOnePasswordPolicy.bindPasswordField(passwordInput, checklist, passwordPolicy);
            }
            if (opts.loginEmailHint) {
              policyHint.textContent = "Sign in with: " + opts.loginEmailHint;
            }
            form.hidden = false;
          })
          .catch(() => {
            intro.textContent = "Could not load sign-up options for this application.";
          });
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const pwd = passwordInput.value;
        if (passwordPolicy && !SecureOnePasswordPolicy.meetsPolicy(pwd, passwordPolicy)) {
          status.className = "msg err";
          status.textContent = "Password does not meet all requirements.";
          return;
        }
        status.className = "msg";
        status.textContent = "Creating account…";
        const res = await fetch(
          "/api/v1/applications/" + encodeURIComponent(applicationId) + "/signup",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
              firstName: document.getElementById("first").value,
              lastName: document.getElementById("last").value,
            }),
          }
        );
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          status.className = "msg ok";
          const loginHref =
            "/login.html?applicationId=" + encodeURIComponent(applicationId);
          status.innerHTML =
            (data.message || "Account created.") +
            (data.loginEmail
              ? '<br/>Sign in with <code>' + data.loginEmail + "</code>"
              : "") +
            ' <br/><a href="' + loginHref + '">Go to sign in</a>';
          form.hidden = true;
        } else {
          status.className = "msg err";
          status.textContent = data.detail || data.title || "Sign-up failed (" + res.status + ")";
        }
      });
    </script>
  </body>
</html>
