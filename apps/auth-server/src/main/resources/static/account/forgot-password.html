<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot password · SecureOne</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 28rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        margin-bottom: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .msg {
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 8px;
        font-size: 0.875rem;
      }
      .ok {
        background: #ecfdf5;
        color: #065f46;
      }
      .err {
        background: #fef2f2;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <h1>Forgot password</h1>
    <p id="intro">Enter your email. If an account exists, you will receive a reset link.</p>
    <form id="form">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" />
      <button type="submit">Send reset link</button>
    </form>
    <div id="status"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const applicationId = params.get("applicationId");
      const form = document.getElementById("form");
      const status = document.getElementById("status");
      const intro = document.getElementById("intro");

      if (!applicationId) {
        form.style.display = "none";
        intro.textContent = "Missing applicationId in the URL. Open this page from your app integration settings.";
        status.className = "msg err";
        status.textContent = "Add ?applicationId=… to the URL.";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        status.textContent = "Sending…";
        status.className = "msg";
        const res = await fetch(
          "/api/v1/applications/" + encodeURIComponent(applicationId) + "/account/password/forgot",
          {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ email: document.getElementById("email").value }),
          }
        );
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          status.className = "msg err";
          status.textContent = data.detail || data.message || "Request failed";
          return;
        }
        status.className = "msg ok";
        status.textContent = data.message || "Check your email if an account exists.";
      });
    </script>
  </body>
</html>
