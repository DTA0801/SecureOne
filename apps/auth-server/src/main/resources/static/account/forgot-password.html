<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot password · SecureOne</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 28rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        margin-bottom: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .msg {
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 8px;
        font-size: 0.875rem;
      }
      .ok {
        background: #ecfdf5;
        color: #065f46;
      }
    </style>
  </head>
  <body>
    <h1>Forgot password</h1>
    <p>Enter your tenant and email. If an account exists, you will receive a reset link.</p>
    <form id="form">
      <label for="tenant">Tenant slug</label>
      <input id="tenant" value="acme" required />
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" />
      <button type="submit">Send reset link</button>
    </form>
    <div id="status"></div>
    <script>
      const form = document.getElementById("form");
      const status = document.getElementById("status");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        status.textContent = "Sending…";
        status.className = "msg";
        const res = await fetch("/api/v1/account/password/forgot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            tenantSlug: document.getElementById("tenant").value,
            email: document.getElementById("email").value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        status.className = "msg ok";
        status.textContent = data.message || "Check your email if an account exists.";
      });
    </script>
  </body>
</html>
