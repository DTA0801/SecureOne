<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OAuth dev tool · SecureOne</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
      button { padding: 0.55rem 1rem; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
      pre { background: #18181b; color: #fafafa; padding: 1rem; overflow: auto; border-radius: 8px; font-size: 12px; }
      .muted { color: #6b7280; font-size: 0.875rem; }
      a { color: #4f46e5; }
    </style>
  </head>
  <body>
    <h1>OAuth dev tool</h1>
    <p class="muted">
      Completes authorization code + PKCE and shows <code>access_token</code>, <code>id_token</code>, and
      <code>/userinfo</code>. Use this when form login at <a href="/login.html">/login.html</a> only created a session
      cookie and your app did not receive a token.
    </p>
    <p id="status" class="muted">Ready.</p>
    <button type="button" id="start" hidden>Start OAuth sign-in (PKCE)</button>
    <pre id="out">{}</pre>
    <p><a href="/login.html">Back to login</a></p>
    <script>
      const CLIENT_ID = "external-test-client";
      const REDIRECT_URI = location.origin + "/account/oauth-dev.html";
      const SCOPES = "openid profile email";
      const VERIFIER_KEY = "secureone.oauth.pkce_verifier";

      function randomVerifier() {
        const bytes = crypto.getRandomValues(new Uint8Array(32));
        return btoa(String.fromCharCode(...bytes))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/, "");
      }

      async function challengeFromVerifier(verifier) {
        const data = new TextEncoder().encode(verifier);
        const digest = await crypto.subtle.digest("SHA-256", data);
        return btoa(String.fromCharCode(...new Uint8Array(digest)))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/, "");
      }

      function setOut(label, payload) {
        document.getElementById("out").textContent =
          label + "\n\n" + JSON.stringify(payload, null, 2);
      }

      async function startAuthorize() {
        const verifier = randomVerifier();
        sessionStorage.setItem(VERIFIER_KEY, verifier);
        const challenge = await challengeFromVerifier(verifier);
        const state = crypto.randomUUID();
        sessionStorage.setItem("secureone.oauth.state", state);
        const params = new URLSearchParams({
          response_type: "code",
          client_id: CLIENT_ID,
          redirect_uri: REDIRECT_URI,
          scope: SCOPES,
          state,
          code_challenge: challenge,
          code_challenge_method: "S256",
        });
        location.href = "/oauth2/authorize?" + params.toString();
      }

      async function exchangeCode(code) {
        const verifier = sessionStorage.getItem(VERIFIER_KEY);
        if (!verifier) throw new Error("Missing PKCE verifier — start sign-in again.");
        const body = new URLSearchParams({
          grant_type: "authorization_code",
          code,
          redirect_uri: REDIRECT_URI,
          client_id: CLIENT_ID,
          code_verifier: verifier,
        });
        const res = await fetch("/oauth2/token", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body,
        });
        const text = await res.text();
        let json = {};
        try {
          json = text ? JSON.parse(text) : {};
        } catch {
          json = { detail: text };
        }
        if (!res.ok) {
          throw new Error(
            json.error_description || json.error || json.detail || text || "Token exchange failed (HTTP " + res.status + ")",
          );
        }
        return json;
      }

      async function fetchUserinfo(accessToken) {
        const res = await fetch("/userinfo", {
          headers: { Authorization: "Bearer " + accessToken },
        });
        return res.json();
      }

      (async function init() {
        const params = new URLSearchParams(location.search);
        const code = params.get("code");
        const error = params.get("error");
        const status = document.getElementById("status");
        const startBtn = document.getElementById("start");

        if (error) {
          status.textContent = "Authorization failed.";
          setOut("OAuth error", {
            error,
            error_description: params.get("error_description"),
          });
          startBtn.hidden = false;
          startBtn.onclick = () => void startAuthorize();
          return;
        }

        if (!code) {
          status.textContent = "Click below to sign in and receive tokens.";
          startBtn.hidden = false;
          startBtn.onclick = () => void startAuthorize();
          return;
        }

        status.textContent = "Exchanging authorization code for tokens…";
        try {
          const tokens = await exchangeCode(code);
          const userinfo = tokens.access_token ? await fetchUserinfo(tokens.access_token) : null;
          status.textContent = "Success — copy tokens below into your app or API client.";
          setOut("Token response + userinfo", { tokens, userinfo });
          history.replaceState({}, "", location.pathname);
        } catch (e) {
          status.textContent = String(e.message || e);
          startBtn.hidden = false;
          startBtn.onclick = () => void startAuthorize();
        }
      })();
    </script>
  </body>
</html>
