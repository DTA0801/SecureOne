<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Set password · SecureOne</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 24rem; margin: 3rem auto; }
      input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; }
      button { width: 100%; padding: 0.6rem; background: #4f46e5; color: #fff; border: none; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h1>Set your password</h1>
    <form id="form">
      <input id="password" type="password" minlength="12" placeholder="New password" required />
      <input id="confirm" type="password" minlength="12" placeholder="Confirm" required />
      <button type="submit">Save password</button>
    </form>
    <p id="status"></p>
    <script>
      const token = new URLSearchParams(location.search).get("token");
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = document.getElementById("password").value;
        if (password !== document.getElementById("confirm").value) {
          document.getElementById("status").textContent = "Passwords do not match.";
          return;
        }
        const res = await fetch("/api/v1/account/set-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        document.getElementById("status").textContent =
          (data.message || "Done") + (data.loginUsername ? " Login as: " + data.loginUsername : "");
      });
    </script>
  </body>
</html>
