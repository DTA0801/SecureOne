<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SecureOne — OAuth callback</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
      code { background: #f4f4f5; padding: 0.15rem 0.35rem; border-radius: 4px; }
      pre { background: #18181b; color: #fafafa; padding: 1rem; overflow: auto; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h1>OAuth callback</h1>
    <p>Serve this file from your app origin (e.g. <code>http://localhost:5173/callback</code>) and complete the authorize redirect here.</p>
    <pre id="out">Waiting for <code>?code=</code> or <code>?error=</code> in the URL…</pre>
    <script>
      const params = new URLSearchParams(location.search);
      const payload = {
        code: params.get("code"),
        state: params.get("state"),
        error: params.get("error"),
        error_description: params.get("error_description"),
      };
      document.getElementById("out").textContent = JSON.stringify(payload, null, 2);
    </script>
  </body>
</html>
